name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # NOTE: tests/integration legacy suites depend on a live agy binary
      # flow and fail without it (pre-existing); the universal suite is
      # the green gate for the gateway + studio.
      - name: Unit tests (universal)
        run: bunx vitest run tests/universal

      # Bridge reload parity: Studio history switches replay the bridge
      # journal (session/load), so gate the bridge persist/replay tests
      # here against the pinned submodule commit.
      - name: Bridge deps (submodule)
        run: bun install
        working-directory: scratch/repos/yitom486-agy-acp-map

      - name: Bridge history tests (reload parity)
        run: bun test tests/history-partial-persist.test.ts src/lib/session-history.test.ts --timeout 30000
        working-directory: scratch/repos/yitom486-agy-acp-map

      - name: Web build
        run: bun run build

      - name: Electron bundle check
        run: bun run build:electron
