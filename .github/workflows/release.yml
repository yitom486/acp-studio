name: Release (Windows, macOS, Linux)

# 打 tag 即发版，例如：git tag v1.0.0 && git push origin v1.0.0
# 说明：取自 CHANGELOG.md 对应版本小节（scripts/release-notes.ts）。
# 产物：Windows NSIS、macOS DMG/ZIP、Linux AppImage/DEB，自动挂到同一个 GitHub Release。
# 当前默认未签名：Windows 可能提示 SmartScreen，macOS 可能提示无法验证开发者。
# 如需正式分发，请分别配置 Windows 代码签名与 macOS Developer ID/notarization secrets。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            package_script: package:win
          - name: macOS
            os: macos-latest
            platform: mac
            package_script: package:mac
          - name: Linux
            os: ubuntu-latest
            platform: linux
            package_script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests (universal)
        run: bunx vitest run tests/universal

      - name: Web build
        run: bun run build

      - name: Electron bundle
        run: bun run build:electron

      - name: Package ${{ matrix.platform }}
        run: bun run ${{ matrix.package_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 发布说明 = CHANGELOG 里与 tag 同版本的小节；找不到就让发版失败
      - name: Release notes from CHANGELOG
        run: bun scripts/release-notes.ts "${GITHUB_REF_NAME#v}" --out release-notes.md

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 不上传 builder-debug.yml / builder-effective-config.yaml 等调试文件
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          fail_on_unmatched_files: true
          body_path: release-notes.md
